<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift — The Store That Comes to You</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --navy:#122436;
  --navy-deep:#0B1A27;
  --sand:#F1EADA;
  --sand-dim:#E4DAC4;
  --teal:#2F6F63;
  --teal-deep:#20514A;
  --rust:#C1622D;
  --coral:#C85C46;
  --amber:#C99A3E;
  --ink:#17242B;
  --paper:#FBF8F1;
}
*{box-sizing:border-box;}
html, body{
  height:100%;
}
body{
  margin:0;
  font-family:'Manrope', sans-serif;
  color:var(--ink);
  background:var(--sand);
  overscroll-behavior:none;
}
.app-shell{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--sand);
  position:relative;
}

.app-header{
  background:linear-gradient(160deg, var(--navy), #0f2231);
  color:var(--sand);
  padding:20px 20px 16px;
  padding-top:max(20px, env(safe-area-inset-top));
  position:relative;
  flex:none;
}
.wordmark{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:8px;
}
.wordmark .mark{
  width:20px;height:20px;
  border-radius:50%;
  border:2px solid var(--rust);
  position:relative;
  flex:none;
}
.wordmark .mark::after{
  content:'';
  position:absolute;
  top:50%; left:50%;
  width:9px;height:2px;
  background:var(--rust);
  transform:translate(-50%,-50%) rotate(35deg);
}
.app-sub{
  font-size:12.5px;
  color:#9FB4BB;
  margin-top:4px;
}
.owner-toggle{
  position:absolute;
  top:max(20px, env(safe-area-inset-top));
  right:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--sand);
  font-family:'Manrope';
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.03em;
  border-radius:999px;
  padding:6px 11px;
  cursor:pointer;
}
.owner-toggle.on{ background:var(--rust); border-color:var(--rust); color:#fff; }

.app-body{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--sand);
  padding:18px 18px calc(90px + env(safe-area-inset-bottom));
}

.section-title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:19px;
  margin:2px 0 4px;
  color:var(--navy);
}
.section-note{ font-size:12.5px; color:#6C7A73; margin:0 0 14px; }

/* ---- TRACK TAB ---- */
.map-wrap{
  background:var(--paper);
  border-radius:20px;
  padding:16px;
  border:1px solid #E3DAC4;
  margin-bottom:14px;
}
.water-map{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  border-radius:14px;
  background: repeating-linear-gradient(120deg, #DCEEE9 0px, #DCEEE9 10px, #D2E9E2 11px, #D2E9E2 20px);
  border:1px dashed #B9CFC8;
  overflow:hidden;
}
.cove{ position:absolute; width:9px;height:9px; border-radius:50%; background:#8FB6AC; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.15); }
.cove-label{ position:absolute; font-size:9.5px; font-weight:700; color:#4C6660; white-space:nowrap; }
.boat-icon{
  position:absolute; width:26px;height:26px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; transform:translate(-50%,-50%);
  transition:top 1.4s ease, left 1.4s ease;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); z-index:5;
}
.user-pin{
  position:absolute; width:16px;height:16px;
  border-radius:50% 50% 50% 0; background:var(--rust); border:2px solid #fff;
  transform:translate(-50%,-100%) rotate(-45deg); box-shadow:0 2px 4px rgba(0,0,0,.25);
  z-index:6; cursor:pointer;
}
.eta-card{ margin-top:14px; background:#fff; border:1px solid #E3DAC4; border-radius:14px; padding:13px 15px; }
.eta-top{ display:flex; justify-content:space-between; align-items:center; }
.eta-label{ font-size:11px; color:#7A857E; font-weight:700; letter-spacing:.03em; }
.eta-value{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--navy); }
.eta-sub{ font-size:12px; color:#6C7A73; margin-top:2px; }
.hail-btn{
  width:100%; margin-top:12px; background:var(--rust); color:#fff; border:none;
  border-radius:10px; padding:12px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Manrope';
}
.hail-btn.sent{ background:var(--teal); }
.hail-btn:disabled{ opacity:.6; cursor:default; }
.hail-hint{ text-align:center; font-size:11.5px; color:#8B978F; margin-top:8px; }

.legend{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:11.5px; color:#556661; margin-top:10px; }
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:9px;height:9px;border-radius:50%;display:inline-block; }

/* ---- SHOP TAB ---- */
.cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.cat-card{ background:#fff; border:1px solid #E3DAC4; border-radius:14px; padding:14px 12px; cursor:pointer; text-align:left; font-family:'Manrope'; }
.cat-card.active{ border-color:var(--teal); background:#EAF3EF; }
.cat-card .cat-emoji{ font-size:20px; }
.cat-card .cat-name{ font-weight:700; font-size:13.5px; margin-top:6px; color:var(--navy); }
.cat-card .cat-desc{ font-size:11.5px; color:#748079; margin-top:2px; }

.item-row{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid #E9E1CE; border-radius:12px; padding:11px 13px; margin-bottom:8px; }
.item-row .item-name{ font-weight:600; font-size:13.5px; color:var(--navy); }
.item-row .item-price{ font-size:12px; color:#7A857E; }
.add-btn{ background:var(--teal); color:#fff; border:none; border-radius:8px; width:30px;height:30px; font-size:17px; line-height:1; cursor:pointer; }
.add-btn:active{ transform:scale(.92); }

.cart-bar{
  position:absolute; left:14px; right:14px; bottom:78px; background:var(--navy); color:#fff;
  border-radius:14px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  font-size:13.5px; box-shadow:0 10px 24px rgba(0,0,0,.28); z-index:15;
}
.cart-bar button{ background:var(--rust); color:#fff; border:none; border-radius:8px; padding:8px 13px; font-weight:700; font-size:12.5px; cursor:pointer; }

.track-wrap{ background:#fff; border:1px solid #E3DAC4; border-radius:16px; padding:16px; }
.track-step{ display:flex; gap:10px; padding:9px 0; }
.track-dot{ width:22px;height:22px; border-radius:50%; background:#E3E9E5; color:#8B978F; font-size:12px; display:flex; align-items:center; justify-content:center; flex:none; font-weight:700; transition:all .25s ease; }
.track-dot.done{ background:var(--teal); color:#fff; }
.track-line{ width:2px; flex:1; background:#E3E9E5; margin-left:10.5px; }
.track-line.done{ background:var(--teal); }
.track-label{ font-size:13px; font-weight:600; color:var(--navy); }
.track-time{ font-size:11px; color:#8B978F; }

/* ---- FISH TAB ---- */
.hotbite{ background:linear-gradient(135deg, var(--teal-deep), var(--teal)); color:#fff; border-radius:16px; padding:16px; margin-bottom:14px; }
.hotbite .h-label{ font-size:11px; letter-spacing:.08em; color:#BFE0D5; font-weight:700; }
.hotbite .h-main{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:4px 0 6px; }
.hotbite .h-sub{ font-size:12px; color:#D8ECE4; line-height:1.5; }
.catch-row{ display:flex; gap:11px; background:#fff; border:1px solid #E9E1CE; border-radius:12px; padding:11px 13px; margin-bottom:8px; align-items:center; }
.catch-icon{ width:34px;height:34px; border-radius:9px; background:#EAF3EF; display:flex;align-items:center;justify-content:center; font-size:16px; flex:none; }
.catch-name{ font-weight:700; font-size:13px; color:var(--navy); }
.catch-meta{ font-size:11px; color:#7A857E; margin-top:1px; }

.angr-badge{
  display:inline-flex; align-items:center; gap:6px; background:#0F2E28; color:#BFE0D5;
  font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:5px 10px; border-radius:999px; margin-bottom:12px;
}
.angr-badge .angr-dot{ width:6px;height:6px;border-radius:50%; background:#5FD8A6; box-shadow:0 0 0 3px rgba(95,216,166,.25); }
.log-catch-btn{
  width:100%; background:#fff; border:1.5px dashed #B7CFC5; color:var(--teal-deep); font-weight:700; font-size:13px;
  border-radius:12px; padding:11px; cursor:pointer; margin-bottom:14px; font-family:'Manrope';
}
.log-catch-btn:hover{ background:#F1F8F5; }
.log-form{ background:#fff; border:1px solid #E3DAC4; border-radius:14px; padding:14px; margin-bottom:14px; }
.log-form label{ display:block; font-size:11px; font-weight:700; color:#6C7A73; letter-spacing:.03em; margin:8px 0 4px; }
.log-form select{ width:100%; padding:9px 10px; border-radius:9px; border:1px solid #DCD3BC; font-family:'Manrope'; font-size:13px; background:#FBF8F1; color:var(--navy); }
.log-form .log-submit{ margin-top:12px; width:100%; background:var(--teal); color:#fff; border:none; border-radius:9px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; }
.new-pulse{ animation:pulseIn .6s ease; }
@keyframes pulseIn{ from{ background:#DCEEE9; } to{ background:#fff; } }

/* ---- ACCOUNT TAB ---- */
.tier-card{ border-radius:16px; padding:16px; margin-bottom:10px; border:1px solid #E3DAC4; background:#fff; }
.tier-card.active{ border-color:var(--rust); background:#FBF1E9; box-shadow:0 0 0 1px var(--rust) inset; }
.tier-top{ display:flex; justify-content:space-between; align-items:center; }
.tier-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; color:var(--navy); }
.tier-price{ font-size:12px; color:#7A857E; }
.tier-badge{ font-size:10px; font-weight:700; color:var(--rust); letter-spacing:.06em; }
.tier-perks{ margin:8px 0 0; padding-left:16px; font-size:12px; color:#5C6963; line-height:1.7; }

/* ---- MANAGE (OWNER) TAB ---- */
.manage-banner{ background:linear-gradient(135deg, var(--rust), #A84E22); color:#fff; border-radius:14px; padding:12px 15px; font-size:12px; line-height:1.5; margin-bottom:14px; font-weight:600; }
.manage-item{ background:#fff; border:1px solid #E9E1CE; border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.manage-item .m-name{ font-weight:600; font-size:13px; color:var(--navy); }
.manage-item .m-price-view{ font-size:12px; color:#7A857E; margin-top:1px; }
.manage-item input[type="number"]{ width:62px; padding:6px 7px; border-radius:7px; border:1px solid #DCD3BC; font-family:'Manrope'; font-size:12.5px; }
.m-actions{ display:flex; gap:6px; flex:none; }
.m-btn{ border:none; border-radius:7px; width:28px;height:28px; font-size:13px; cursor:pointer; display:flex;align-items:center;justify-content:center; }
.m-btn.edit{ background:#EAF3EF; color:var(--teal-deep); }
.m-btn.save{ background:var(--teal); color:#fff; }
.m-btn.del{ background:#FBEAE6; color:var(--coral); }
.add-product-form{ background:#fff; border:1.5px dashed #B7CFC5; border-radius:14px; padding:14px; margin-top:16px; }
.add-product-form label{ display:block; font-size:11px; font-weight:700; color:#6C7A73; letter-spacing:.03em; margin:8px 0 4px; }
.add-product-form input, .add-product-form select{ width:100%; padding:9px 10px; border-radius:9px; border:1px solid #DCD3BC; font-family:'Manrope'; font-size:13px; background:#FBF8F1; color:var(--navy); }
.add-product-form .add-submit{ margin-top:12px; width:100%; background:var(--rust); color:#fff; border:none; border-radius:9px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; }
.advance-btn{ width:100%; margin-top:10px; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:12.5px; cursor:pointer; }

/* ---- TAB BAR ---- */
.tabbar{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #E9E1CE; display:flex; padding:10px 6px calc(16px + env(safe-area-inset-bottom)); z-index:20; }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:#95A29A; font-family:'Manrope'; font-size:10.5px; font-weight:700; padding:4px 0; }
.tab .tab-icon{ font-size:18px; }
.tab.active{ color:var(--rust); }


/* ---- LOGIN MODAL ---- */
.modal-backdrop{
  display:none; position:fixed; inset:0; background:rgba(11,26,39,.6);
  align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-backdrop.open{ display:flex; }
.modal{
  background:var(--paper); border-radius:18px; padding:22px; width:100%; max-width:320px;
  box-shadow:0 30px 60px rgba(0,0,0,.4);
}
.modal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--navy); }
.modal-sub{ font-size:12px; color:#6C7A73; margin:4px 0 14px; line-height:1.5; }
.modal label{ display:block; font-size:11px; font-weight:700; color:#6C7A73; letter-spacing:.03em; margin:10px 0 4px; }
.modal input{ width:100%; padding:10px 11px; border-radius:9px; border:1px solid #DCD3BC; font-family:'Manrope'; font-size:13px; background:#fff; color:var(--navy); }
.modal-error{ color:var(--coral); font-size:12px; margin-top:8px; min-height:16px; }
.modal-submit{ width:100%; margin-top:12px; background:var(--rust); color:#fff; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:13px; cursor:pointer; }
.modal-cancel{ width:100%; margin-top:8px; background:none; border:none; color:#8B978F; font-size:12.5px; padding:6px; cursor:pointer; }

</style>
</head>
<body>

<div class="app-shell">
  <div class="app-header">
    <div class="wordmark"><span class="mark"></span>Drift</div>
    <div class="app-sub" id="headerSub">Loading…</div>
    <button class="owner-toggle" id="ownerToggle">OWNER VIEW</button>
  </div>

  <div class="app-body" id="appBody"></div>

  <div class="tabbar" id="tabbar">
    <button class="tab active" data-tab="track"><span class="tab-icon">📍</span>Track</button>
    <button class="tab" data-tab="shop"><span class="tab-icon">🛒</span>Shop</button>
    <button class="tab" data-tab="fish"><span class="tab-icon">🎣</span>Fish</button>
    <button class="tab" data-tab="account"><span class="tab-icon">👤</span>Account</button>
    <button class="tab owner-only" data-tab="manage" style="display:none;"><span class="tab-icon">🛠️</span>Manage</button>
  </div>
</div>

<div class="modal-backdrop" id="loginBackdrop">
  <div class="modal">
    <div class="modal-title">Owner Sign In</div>
    <div class="modal-sub">Sign in with the owner account created in Supabase Auth.</div>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@drift.app">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <div class="modal-error" id="loginError"></div>
    <button class="modal-submit" id="loginSubmit">Sign In</button>
    <button class="modal-cancel" id="loginCancel">Cancel</button>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script>
// ============================================================
// EDIT THESE TWO LINES with your own Supabase project values
// (Supabase → Project Settings → API)
// ============================================================
const SUPABASE_URL = "https://zhyfkhpcktfxtkmeiaul.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LIdiFsJNg9wwBM3WB57E7w_B0lhaeU1";

// ============================================================
// DRIFT — app.js
// Reads/writes live data from Supabase: products, boat position,
// hails, catches, and delivery orders. See supabase/schema.sql
// for the tables this expects, and README.md for setup steps.
// ============================================================

// ============================================================
// On-page error surface — so any failure shows up as readable
// text in the app itself, not just buried in dev tools.
// ============================================================
window.addEventListener('error', (e) => {
  showOnPageError(e.error && e.error.message ? e.error.message : (e.message || 'Unknown script error'));
});
window.addEventListener('unhandledrejection', (e) => {
  showOnPageError(e.reason && e.reason.message ? e.reason.message : String(e.reason));
});
function showOnPageError(message){
  const el = document.getElementById('appBody');
  const sub = document.getElementById('headerSub');
  if (!el) return;
  if (sub) sub.textContent = 'Something went wrong';
  el.innerHTML = `
    <div class="manage-banner" style="background:linear-gradient(135deg, var(--coral), #A8402C);">
      <div style="font-weight:800; margin-bottom:4px;">App error</div>
      <div style="font-weight:500; font-size:12px; line-height:1.6; word-break:break-word;">${message}</div>
    </div>
    <div class="section-note">If this mentions "supabase" or "createClient," the Supabase script may not have loaded (check your internet connection or an ad blocker) or config.js still needs your real project values.</div>
  `;
}

let sb;
try {
  if (typeof supabase === 'undefined') throw new Error('The Supabase library did not load — check your internet connection, or an ad blocker/extension may be blocking cdn.jsdelivr.net.');
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e){
  showOnPageError(e.message);
}

const appBody = document.getElementById('appBody');
const headerSub = document.getElementById('headerSub');
const tabs = document.querySelectorAll('.tab');

const CATEGORY_META = {
  ice:      {label:'Ice',            emoji:'🧊', desc:'Bagged & cooler-fill'},
  bait:     {label:'Bait & Tackle',  emoji:'🎣', desc:'Fresh bait, fast fixes'},
  food:     {label:'Food & Drinks',  emoji:'🥪', desc:'Grab-and-go'},
  supplies: {label:'Supplies',       emoji:'🧰', desc:'What you forgot'},
};

// Stylized route map — purely visual. The real signal (route_index) comes from boat_status.
const ROUTE = [
  {name:'Marina Point',   top:'12%', left:'20%'},
  {name:'Oyster Bar',     top:'8%',  left:'52%'},
  {name:'North Flats',    top:'28%', left:'78%'},
  {name:'Sunset Cove',    top:'55%', left:'82%'},
  {name:'Inlet Mouth',    top:'78%', left:'58%'},
  {name:'Grass Line',     top:'82%', left:'26%'},
];
const USER_LOCATION = {top:'50%', left:'40%'};

const SPECIES = ['Redfish','Speckled Trout','Flounder','Sheepshead','Black Drum','Snook'];
const BAITS = ['Live shrimp','Mud minnow','Topwater lure','Frozen mullet','Soft plastic','Cut bait'];
const SPOTS = ['North Flats','Sunset Cove','Grass Line','Inlet Mouth','Oyster Bar'];
const SPECIES_ICON = {'Redfish':'🐟','Speckled Trout':'🐠','Flounder':'🐟','Sheepshead':'🐡','Black Drum':'🐟','Snook':'🐠'};

const TIERS = [
  {id:'free', name:'Free Boater', price:'No cost', perks:['App access','Standard pricing','Standard hail fee']},
  {id:'member', name:'Member', price:'$9/mo', perks:['10% store discount','Waived hail fee','Priority pre-order queue']},
  {id:'premium', name:'Premium Captain', price:'$29/mo', perks:['Free cooler-fill ice','Guaranteed same-day hail response','Discounted onboard prices']},
  {id:'elite', name:'Elite', price:'$79/mo', perks:['Standing sunset-run reservation','Free boat-side delivery, always','Direct text line to the boat']},
];

let state = {
  tab: 'track',
  located: false,
  userLat: null,
  userLng: null,
  cart: [],
  activeCat: 'ice',
  currentOrder: null,   // {id, status}
  tier: 'premium',
  showLogForm: false,
  justLogged: false,
  ownerMode: false,
  manageCat: 'ice',
  editingIndex: null,
  session: null,
  loading: true,
};

let CATALOG = {};   // { ice: {label,emoji,desc,items:[{id,name,price}]}, ... }
let CATCHES = [];
let BOAT = { route_index: 0, hailed: false, hail_note: null, eta_minutes: 22 };

// ------------------------------------------------------------
// INIT
// ------------------------------------------------------------
async function init(){
  const initErrors = [];

  if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_SUPABASE') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){
    state.loading = false;
    renderFatalError('config.js still has placeholder values',
      'Open config.js in your repo and paste in your real Supabase Project URL and anon key from Project Settings → API, then push the change.');
    return;
  }

  try {
    const { data: { session } } = await sb.auth.getSession();
    state.session = session;
    state.ownerMode = !!session;
  } catch (e){ initErrors.push('Auth check failed: ' + e.message); }

  const results = await Promise.allSettled([fetchProducts(), fetchBoatStatus(), fetchCatches()]);
  results.forEach((r, i) => {
    if (r.status === 'rejected'){
      const names = ['products', 'boat_status', 'catches'];
      initErrors.push(`Couldn't load "${names[i]}": ${r.reason && r.reason.message ? r.reason.message : r.reason}`);
    }
  });

  state.loading = false;

  if (initErrors.length){
    renderFatalError('Couldn\u2019t connect to Supabase', initErrors.join(' — '));
    return;
  }

  render();
  subscribeRealtime();

  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    state.ownerMode = !!session;
    if (!state.ownerMode && state.tab === 'manage') state.tab = 'shop';
    render();
  });
}

function renderFatalError(title, detail){
  headerSub.textContent = 'Setup needed';
  appBody.innerHTML = `
    <div class="manage-banner" style="background:linear-gradient(135deg, var(--coral), #A8402C);">
      <div style="font-weight:800; margin-bottom:4px;">${title}</div>
      <div style="font-weight:500; font-size:12px; line-height:1.6;">${detail}</div>
    </div>
    <div class="section-note">This is a setup issue, not a bug in the app itself — once Supabase is reachable, everything below will load normally. Check:</div>
    <div class="manage-item"><div class="m-name">1. config.js has your real Project URL + anon key (not the placeholder text)</div></div>
    <div class="manage-item"><div class="m-name">2. supabase/schema.sql has been run in the Supabase SQL Editor</div></div>
    <div class="manage-item"><div class="m-name">3. Your Supabase project is unpaused (free projects pause after a week of inactivity — check the Supabase dashboard)</div></div>
  `;
}

async function fetchProducts(){
  const { data, error } = await sb.from('products').select('*').order('created_at');
  if (error) throw error;
  const grouped = {};
  Object.keys(CATEGORY_META).forEach(k => grouped[k] = { ...CATEGORY_META[k], items: [] });
  (data || []).forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = { label:p.category, emoji:'📦', desc:'', items:[] };
    grouped[p.category].items.push({ id:p.id, name:p.name, price:Number(p.price) });
  });
  CATALOG = grouped;
}

async function fetchBoatStatus(){
  const { data, error } = await sb.from('boat_status').select('*').eq('id', 1).single();
  if (error) throw error;
  BOAT = data;
}

async function fetchCatches(){
  const { data, error } = await sb.from('catches').select('*').order('logged_at', { ascending:false }).limit(20);
  if (error) throw error;
  CATCHES = data || [];
}

function subscribeRealtime(){
  sb.channel('boat_status_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'boat_status' }, payload => {
      BOAT = payload.new;
      if (state.tab === 'track') render();
    }).subscribe();

  sb.channel('products_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'products' }, async () => {
      await fetchProducts();
      if (state.tab === 'shop' || state.tab === 'manage') render();
    }).subscribe();

  sb.channel('catches_changes')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'catches' }, payload => {
      CATCHES = [payload.new, ...CATCHES].slice(0, 20);
      if (state.tab === 'fish') render();
    }).subscribe();

  sb.channel('orders_changes')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'orders' }, payload => {
      if (state.currentOrder && payload.new.id === state.currentOrder.id){
        state.currentOrder.status = payload.new.status;
        if (state.tab === 'shop') render();
      }
    }).subscribe();
}

// ------------------------------------------------------------
// RENDER DISPATCH
// ------------------------------------------------------------
function render(){
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
  document.querySelectorAll('.owner-only').forEach(el => el.style.display = state.ownerMode ? 'flex' : 'none');
  const ownerBtn = document.getElementById('ownerToggle');
  if (ownerBtn) ownerBtn.classList.toggle('on', state.ownerMode);

  headerSub.textContent = state.loading
    ? 'Loading…'
    : state.ownerMode
      ? 'Owner view · editing live catalog'
      : (state.located
          ? (BOAT.hailed ? `Hailed · ETA ${BOAT.eta_minutes} min` : 'Location set · on today\u2019s route')
          : 'Set your location to get started');

  if (state.loading) { appBody.innerHTML = `<div class="section-note">Connecting to Drift…</div>`; return; }

  if (state.tab === 'track') renderTrack();
  else if (state.tab === 'shop') renderShop();
  else if (state.tab === 'fish') renderFish();
  else if (state.tab === 'manage') renderManage();
  else renderAccount();
}

function renderTrack(){
  const boat = ROUTE[BOAT.route_index % ROUTE.length];
  let html = `
    <div class="section-title">Where's Drift One</div>
    <div class="section-note">Live position, today's route, and your spot on the water.</div>
    <div class="map-wrap">
      <div class="water-map">`;
  ROUTE.forEach(c=>{
    html += `<div class="cove" style="top:${c.top};left:${c.left}"></div>
      <div class="cove-label" style="top:calc(${c.top} + 10px);left:${c.left}">${c.name}</div>`;
  });
  if (state.located){
    html += `<div class="user-pin" style="top:${USER_LOCATION.top};left:${USER_LOCATION.left}" title="Your location"></div>
      <div class="cove-label" style="top:calc(${USER_LOCATION.top} + 6px);left:calc(${USER_LOCATION.left} + 10px); color:var(--rust);">You</div>`;
  }
  html += `<div class="boat-icon" style="top:${boat.top};left:${boat.left}">🚤</div>
    </div>
      <div class="legend">
        <span><i class="dot" style="background:#8FB6AC"></i>Route stop</span>
        <span><i class="dot" style="background:#C1622D"></i>Your location</span>
        <span>🚤 Drift One</span>
      </div>
    </div>`;

  if (!state.located){
    html += `<button class="hail-btn" id="setLocBtn">Set my location</button>
      <div class="hail-hint">Uses your device's GPS so Drift One and the owner know roughly where you are.</div>`;
  } else {
    html += `<div class="eta-card">
      <div class="eta-top">
        <div>
          <div class="eta-label">${BOAT.hailed ? 'HAILED · ETA' : 'CURRENTLY NEAR'}</div>
          <div class="eta-value">${BOAT.hailed ? (BOAT.eta_minutes > 0 ? BOAT.eta_minutes + ' min' : 'Arriving now') : boat.name}</div>
        </div>
      </div>
      <div class="eta-sub">${
        BOAT.hailed
          ? `Drift One has your hail and is adjusting course.`
          : `Drift One is running its published route today and will pass near you.`
      }</div>
    </div>
    <button class="hail-btn ${BOAT.hailed?'sent':''}" id="hailBtn">${
      BOAT.hailed ? 'Cancel hail' : 'Request a stop'
    }</button>
    <div class="hail-hint">${BOAT.hailed ? '' : 'Or just wait — it\u2019s already headed your way on today\u2019s route.'}</div>`;
  }

  appBody.innerHTML = html;

  const setLocBtn = appBody.querySelector('#setLocBtn');
  if (setLocBtn) setLocBtn.addEventListener('click', requestLocation);

  const hailBtn = appBody.querySelector('#hailBtn');
  if (hailBtn) hailBtn.addEventListener('click', toggleHail);
}

function requestLocation(){
  if (!navigator.geolocation){
    state.located = true; state.userLat = null; state.userLng = null;
    render();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.located = true;
      state.userLat = pos.coords.latitude;
      state.userLng = pos.coords.longitude;
      render();
    },
    () => { state.located = true; render(); },
    { timeout:8000 }
  );
}

async function toggleHail(){
  const hailNote = (state.userLat != null)
    ? `${state.userLat.toFixed(4)}, ${state.userLng.toFixed(4)}`
    : 'Location unavailable';
  const next = !BOAT.hailed;
  const { data, error } = await sb.from('boat_status')
    .update({ hailed: next, hail_note: next ? hailNote : null, eta_minutes: next ? 8 : 22, updated_at: new Date().toISOString() })
    .eq('id', 1).select().single();
  if (!error && data) BOAT = data;
  render();
}

function renderShop(){
  let html = `<div class="section-title">Order Ahead</div>
    <div class="section-note">Order now — Drift One brings it right to your boat.</div>
    <div class="cat-grid">`;
  Object.entries(CATALOG).forEach(([key,cat])=>{
    html += `<button class="cat-card ${state.activeCat===key?'active':''}" data-cat="${key}">
      <div class="cat-emoji">${cat.emoji}</div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-desc">${cat.desc}</div>
    </button>`;
  });
  html += `</div>`;

  if (state.currentOrder){
    html += renderTracker();
  } else if (CATALOG[state.activeCat]) {
    CATALOG[state.activeCat].items.forEach((item)=>{
      html += `<div class="item-row">
        <div><div class="item-name">${item.name}</div><div class="item-price">$${item.price.toFixed(2)}</div></div>
        <button class="add-btn" data-add="${item.id}">+</button>
      </div>`;
    });
  }
  appBody.innerHTML = html;

  if (state.cart.length && !state.currentOrder){
    const total = state.cart.reduce((a,c)=>a+c.price,0);
    const bar = document.createElement('div');
    bar.className = 'cart-bar';
    bar.innerHTML = `<span>${state.cart.length} item${state.cart.length>1?'s':''} · $${total.toFixed(2)}</span>
      <button id="deliverBtn">${state.located ? 'Deliver to my boat' : 'Set location first'}</button>`;
    appBody.appendChild(bar);
    bar.querySelector('#deliverBtn').addEventListener('click', ()=>{
      if (!state.located) { state.tab='track'; render(); return; }
      placeOrder();
    });
  }

  appBody.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.activeCat = btn.dataset.cat; render(); });
  });
  appBody.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = CATALOG[state.activeCat].items.find(i => i.id === btn.dataset.add);
      if (item) state.cart.push(item);
      render();
    });
  });
}

async function placeOrder(){
  const total = state.cart.reduce((a,c)=>a+c.price,0);
  const locationNote = (state.userLat != null) ? `${state.userLat.toFixed(4)}, ${state.userLng.toFixed(4)}` : 'Set, coordinates unavailable';
  const { data, error } = await sb.from('orders').insert({
    items: state.cart.map(c => ({ name:c.name, price:c.price })),
    total, location_note: locationNote, status: 'placed'
  }).select().single();
  if (error) { console.error(error); return; }
  state.currentOrder = { id: data.id, status: 'placed' };
  render();
  runOrderSimulation(data.id);
}

// In production the crew updates order status from their own device.
// This simulates that progression so the demo (and a real early launch
// with one boat and no separate crew app) still shows live movement.
async function runOrderSimulation(orderId){
  const steps = ['assigned','en_route','delivered'];
  for (const step of steps){
    await new Promise(r => setTimeout(r, 1800));
    const { data, error } = await sb.from('orders').update({ status: step }).eq('id', orderId).select().single();
    if (!error && data && state.currentOrder && state.currentOrder.id === orderId){
      state.currentOrder.status = data.status;
      if (state.tab === 'shop') render();
    }
  }
}

function renderTracker(){
  const order = state.currentOrder;
  const labels = [
    {key:'placed', l:'Order placed', t:'Confirmed'},
    {key:'assigned', l:'Crew assigned', t:'On Drift One'},
    {key:'en_route', l:'On the way to your boat', t:'En route'},
    {key:'delivered', l:'Delivered to your boat', t:'Enjoy'},
  ];
  const stepIndex = labels.findIndex(l => l.key === order.status);
  let html = `<div class="track-wrap">`;
  labels.forEach((s, idx)=>{
    const done = idx <= stepIndex;
    html += `<div class="track-step">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <div class="track-dot ${done?'done':''}">${done?'✓':idx+1}</div>
        ${idx < labels.length-1 ? `<div class="track-line ${idx<stepIndex?'done':''}" style="height:24px;"></div>` : ''}
      </div>
      <div style="padding-top:1px;">
        <div class="track-label">${s.l}</div>
        <div class="track-time">${done ? s.t : '—'}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  if (order.status === 'delivered'){
    html += `<div class="eta-card" style="margin-top:12px;">Delivered. Head back to Shop to start a new order.</div>
      <button class="hail-btn" id="resetOrder" style="margin-top:10px;">New order</button>`;
  }
  return html;
}

function computeHotBite(){
  if (!CATCHES.length) return { species:'—', bait:'—', spot:'—' };
  const counts = {};
  CATCHES.forEach(c => counts[c.species] = (counts[c.species]||0) + 1);
  let topSpecies = CATCHES[0].species, max = 0;
  Object.entries(counts).forEach(([sp,ct])=>{ if (ct > max){ max = ct; topSpecies = sp; } });
  const matching = CATCHES.filter(c => c.species === topSpecies);
  const baitCounts = {};
  matching.forEach(c => baitCounts[c.bait] = (baitCounts[c.bait]||0)+1);
  let topBait = matching[0].bait, bmax = 0;
  Object.entries(baitCounts).forEach(([b,ct])=>{ if (ct > bmax){ bmax = ct; topBait = b; } });
  return { species: topSpecies, bait: topBait, spot: matching[0].spot };
}

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  return `${hrs} hr ago`;
}

function renderFish(){
  const hb = computeHotBite();
  let html = `
    <div class="angr-badge"><span class="angr-dot"></span>LIVE CATCH FEED</div>
    <div class="section-title">On the Water Today</div>
    <div class="section-note">Every catch logged here updates this board in real time for everyone.</div>
    <div class="hotbite">
      <div class="h-label">TODAY'S HOT BITE</div>
      <div class="h-main">${hb.species} on ${hb.bait}</div>
      <div class="h-sub">Best spot right now: ${hb.spot}</div>
    </div>
    <button class="log-catch-btn" id="logCatchBtn">${state.showLogForm ? '– Close' : '+ Log a catch'}</button>
    ${state.showLogForm ? `
    <div class="log-form">
      <label>Species</label>
      <select id="logSpecies">${SPECIES.map(s=>`<option>${s}</option>`).join('')}</select>
      <label>Bait / lure</label>
      <select id="logBait">${BAITS.map(b=>`<option>${b}</option>`).join('')}</select>
      <label>Spot</label>
      <select id="logSpot">${SPOTS.map(s=>`<option>${s}</option>`).join('')}</select>
      <button class="log-submit" id="submitCatch">Post to the board</button>
    </div>` : ''}
    <div class="section-title" style="font-size:15px;">Recent catches</div>`;
  CATCHES.forEach((c,i)=>{
    html += `<div class="catch-row ${i===0 && state.justLogged ? 'new-pulse' : ''}">
      <div class="catch-icon">${SPECIES_ICON[c.species]||'🐟'}</div>
      <div><div class="catch-name">${c.species}</div><div class="catch-meta">${timeAgo(c.logged_at)} · ${c.bait} · ${c.spot}</div></div>
    </div>`;
  });
  appBody.innerHTML = html;

  const logBtn = appBody.querySelector('#logCatchBtn');
  if (logBtn) logBtn.addEventListener('click', ()=>{ state.showLogForm = !state.showLogForm; render(); });

  const submitBtn = appBody.querySelector('#submitCatch');
  if (submitBtn) submitBtn.addEventListener('click', async ()=>{
    const species = document.getElementById('logSpecies').value;
    const bait = document.getElementById('logBait').value;
    const spot = document.getElementById('logSpot').value;
    const { data, error } = await sb.from('catches').insert({ species, bait, spot, source:'drift' }).select().single();
    if (!error && data){
      CATCHES = [data, ...CATCHES];
      state.showLogForm = false;
      state.justLogged = true;
      render();
      setTimeout(()=>{ state.justLogged = false; }, 900);
    }
  });
}

// ------------------------------------------------------------
// MANAGE (OWNER) TAB
// ------------------------------------------------------------
function renderManage(){
  const boatCove = ROUTE[BOAT.route_index % ROUTE.length];
  let html = `
    <div class="manage-banner">Owner View — changes here go straight to Supabase and every customer sees them live.</div>`;

  if (BOAT.hailed){
    html += `<div class="eta-card" style="margin-bottom:14px;">
      <div class="eta-label">ACTIVE HAIL</div>
      <div class="eta-value" style="font-size:15px;">${BOAT.hail_note || 'Location unavailable'}</div>
      <div class="eta-sub">A customer is waiting on a stop.</div>
    </div>`;
  }

  html += `
    <div class="section-title" style="font-size:16px;">Boat Position</div>
    <div class="section-note">Currently at <b>${boatCove.name}</b>. Advance it as Drift One actually moves.</div>
    <button class="advance-btn" id="advanceBtn">Advance to next stop →</button>

    <div class="section-title" style="margin-top:20px;">Manage Products</div>
    <div class="section-note">Pick a category, edit prices, remove items, or add something new.</div>
    <div class="cat-grid">`;
  Object.entries(CATALOG).forEach(([key,cat])=>{
    html += `<button class="cat-card ${state.manageCat===key?'active':''}" data-mcat="${key}">
      <div class="cat-emoji">${cat.emoji}</div>
      <div class="cat-name">${cat.label}</div>
      <div class="cat-desc">${cat.items.length} item${cat.items.length===1?'':'s'}</div>
    </button>`;
  });
  html += `</div>`;

  const activeCat = CATALOG[state.manageCat];
  if (activeCat){
    activeCat.items.forEach((item, i)=>{
      const editing = state.editingIndex === i;
      html += `<div class="manage-item">
        <div>
          <div class="m-name">${item.name}</div>
          ${editing
            ? `<div class="m-price-view">$ <input type="number" step="0.5" id="editPrice" value="${item.price}"></div>`
            : `<div class="m-price-view">$${item.price.toFixed(2)}</div>`
          }
        </div>
        <div class="m-actions">
          ${editing
            ? `<button class="m-btn save" data-save="${item.id}">✓</button>`
            : `<button class="m-btn edit" data-edit="${i}">✎</button>`
          }
          <button class="m-btn del" data-del="${item.id}">✕</button>
        </div>
      </div>`;
    });
  }

  html += `
    <div class="add-product-form">
      <label>Product name</label>
      <input type="text" id="newProdName" placeholder="e.g. Dockside Cold Brew">
      <label>Price ($)</label>
      <input type="number" step="0.5" id="newProdPrice" placeholder="0.00">
      <button class="add-submit" id="addProdBtn">Add to ${activeCat ? activeCat.label : state.manageCat}</button>
    </div>
    <button class="hail-btn" id="signOutBtn" style="margin-top:20px;background:none;border:1.5px solid #DCD3BC;color:var(--navy);">Sign out</button>`;

  appBody.innerHTML = html;

  const advanceBtn = appBody.querySelector('#advanceBtn');
  if (advanceBtn) advanceBtn.addEventListener('click', async ()=>{
    const nextIndex = (BOAT.route_index + 1) % ROUTE.length;
    const { data, error } = await sb.from('boat_status')
      .update({ route_index: nextIndex, updated_at: new Date().toISOString() })
      .eq('id', 1).select().single();
    if (!error && data) BOAT = data;
    render();
  });

  appBody.querySelectorAll('[data-mcat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.manageCat = btn.dataset.mcat; state.editingIndex = null; render(); });
  });
  appBody.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editingIndex = Number(btn.dataset.edit); render(); });
  });
  appBody.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.save;
      const val = parseFloat(document.getElementById('editPrice').value);
      if (!isNaN(val) && val >= 0){
        await sb.from('products').update({ price: val }).eq('id', id);
        await fetchProducts();
      }
      state.editingIndex = null;
      render();
    });
  });
  appBody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await sb.from('products').delete().eq('id', btn.dataset.del);
      await fetchProducts();
      state.editingIndex = null;
      render();
    });
  });
  const addBtn = appBody.querySelector('#addProdBtn');
  if (addBtn) addBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('newProdName').value.trim();
    const price = parseFloat(document.getElementById('newProdPrice').value);
    if (!name || isNaN(price) || price < 0) return;
    await sb.from('products').insert({ category: state.manageCat, name, price });
    await fetchProducts();
    render();
  });
  const signOutBtn = appBody.querySelector('#signOutBtn');
  if (signOutBtn) signOutBtn.addEventListener('click', async ()=>{
    await sb.auth.signOut();
  });
}

// ------------------------------------------------------------
// TAB BAR + OWNER LOGIN MODAL
// ------------------------------------------------------------
tabs.forEach(t=>{
  t.addEventListener('click', ()=>{ state.tab = t.dataset.tab; render(); });
});

const loginBackdrop = document.getElementById('loginBackdrop');
document.getElementById('ownerToggle').addEventListener('click', async ()=>{
  if (state.ownerMode){
    await sb.auth.signOut();
    return;
  }
  loginBackdrop.classList.add('open');
  document.getElementById('loginError').textContent = '';
});
document.getElementById('loginCancel').addEventListener('click', ()=>{
  loginBackdrop.classList.remove('open');
});
document.getElementById('loginSubmit').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ errEl.textContent = error.message; return; }
  loginBackdrop.classList.remove('open');
  state.session = data.session;
  state.ownerMode = true;
  state.tab = 'manage';
  render();
});

document.addEventListener('click', (e)=>{
  if (e.target && e.target.id === 'resetOrder'){
    state.cart = [];
    state.currentOrder = null;
    render();
  }
});

if (sb) init();
